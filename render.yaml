services:
  - type: web
    name: hyperfit-nutrition
    runtime: python
    rootDir: apps/api
    plan: free
    buildCommand: pip install .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: HYPERFIT_ALLOWED_ORIGINS
        value: https://hyperfit-nutrition-web.onrender.com
      - key: HYPERFIT_ADMIN_EMAIL
        value: joudali1910@gmailcom
      - key: HYPERFIT_ADMIN_NAME
        value: جود علي
      - key: HYPERFIT_ADMIN_PASSWORD
        sync: false

  - type: web
    name: hyperfit-nutrition-web
    runtime: static
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @hyperfit/web build
    staticPublishPath: apps/web/out
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://hyperfit-nutrition.onrender.com/api/v1
