services:
  - type: web
    name: hyperfit-nutrition-api-jashehri
    runtime: python
    rootDir: apps/api
    plan: starter
    buildCommand: pip install .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    disk:
      name: hyperfit-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: HYPERFIT_DATABASE_PATH
        value: /var/data/hyperfit.db
      - key: HYPERFIT_ALLOWED_ORIGINS
        value: https://hyperfit-nutrition-web-jashehri.onrender.com
      - key: HYPERFIT_ADMIN_EMAIL
        value: joudali1910@gmailcom
      - key: HYPERFIT_ADMIN_NAME
        value: جود علي
      - key: HYPERFIT_ADMIN_PASSWORD
        sync: false

  - type: web
    name: hyperfit-nutrition-web-jashehri
    runtime: static
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @hyperfit/web build
    staticPublishPath: apps/web/out
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://hyperfit-nutrition-api-jashehri.onrender.com/api/v1
